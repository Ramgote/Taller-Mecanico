<!DOCTYPE html>
<html lang="es">
<head>
    {% include "base/head.html" %}
</head>

<body class="d-flex flex-column min-vh-100">

    <!-- NAVBAR -->
    {% include "base/navbar.html" %}

    <div class="container-fluid flex-grow-1">
        <div class="row h-100">

            <!-- SIDEBAR -->
            <aside class="col-md-2 bg-dark text-white p-0 vh-100 position-fixed">
                {% include "base/sidebar.html" %}
            </aside>

            <!-- CONTENIDO -->
            <main class="col-md-10 offset-md-2 p-4">

                <!-- MENSAJES -->
                {% if messages %}
                    {% for message in messages %}
                        <div class="alert alert-{{ message.tags }} shadow-sm">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}

                <!-- CONTENIDO DINÁMICO -->
                {% block content %}
                {% endblock %}

            </main>

        </div>
    </div>

    <!-- FOOTER -->
    {% include "base/footer.html" %}

</body>
</html>

{% extends "base.html" %}
{% block content %}

<h2>Modelos</h2>

<a href="{% url 'crear_modelo' %}" class="btn btn-primary mb-3">
    Nuevo Modelo
</a>

<table class="table table-striped">
    <tr>
        <th>Nombre</th>
        <th></th>
    </tr>

    {% for m in modelos %}
    <tr>
        <td>{{ m.nombre }}</td>
        <td>
            <a href="{% url 'editar_modelo' m.id %}" class="btn btn-warning btn-sm">
                Editar
            </a>
            <a href="{% url 'baja_modelo' m.id %}" class="btn btn-danger btn-sm">
                Baja
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}

{% extends "base.html" %}
{% block content %}

<h2>Modelos</h2>

<a href="{% url 'crear_modelo' %}" class="btn btn-primary mb-3">
    Nuevo Modelo
</a>

<table class="table table-striped">
    <tr>
        <th>Marca</th>
        <th>Modelo</th>
    </tr>

    {% for m in modelos %}
    <tr>
        <td>{{ m.marca.nombre }}</td>
        <td>{{ m.nombre }}</td>
    </tr>
    {% endfor %}
</table>

{% endblock %}

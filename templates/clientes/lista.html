{% extends "base.html" %}
{% block content %}

<h2>Clientes</h2>

<a href="{% url 'crear_cliente' %}" class="btn btn-primary mb-3">
    Nuevo Cliente
</a>

<table class="table table-striped">
    <tr>
        <th>Nombre</th>
        <th>Teléfono</th>
        <th>NIT/CI</th>
        <th></th>
    </tr>

    {% for c in clientes %}
    <tr>
        <td>{{ c.nombre }}</td>
        <td>{{ c.telefono }}</td>
        <td>{{ c.nit_ci }}</td>
        <td>
            <a href="{% url 'editar_cliente' c.id %}" class="btn btn-warning btn-sm">
                Editar
            </a>

            <a href="{% url 'baja_cliente' c.id %}" class="btn btn-danger btn-sm">
                Dar de baja
            </a>
        </td>
    </tr>
    {% endfor %}
</table>

{% endblock %}
